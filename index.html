<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZareStreams</title>
  <meta name="description" content="ZareStreams: watch in your browser or get the Android app." />
  <meta name="theme-color" content="#0b0b0d" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta property="og:title" content="ZareStreams" />
  <meta property="og:image" content="https://zarestreams.com/logo-640.png" />
  <style>
    :root {
      --bg: #0b0b0d;
      --surface: #141418;
      --border: #2a2a32;
      --text: #f5f5f7;
      --muted: #a3a3ad;
      --red: #ef1c24;
      --red-hover: #ff3a41;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px 32px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }

    /* The red glow behind the logo, beating like a heart: two quick pulses, then a rest. */
    body::before {
      content: "";
      position: fixed;
      left: 50%;
      top: 50%;
      width: 1100px;
      height: 1100px;
      max-width: 220vw;
      max-height: 220vw;
      transform: translate(-50%, -50%);
      background: radial-gradient(closest-side, rgba(239, 28, 36, 0.45), rgba(239, 28, 36, 0.16) 55%, transparent);
      pointer-events: none;
      z-index: -1;
      animation: beat 6s ease-in-out infinite;
    }

    @keyframes beat {
      0%   { opacity: 0.6;  transform: translate(-50%, -50%) scale(0.92); }
      12%  { opacity: 1;    transform: translate(-50%, -50%) scale(1.04); }
      24%  { opacity: 0.7;  transform: translate(-50%, -50%) scale(0.96); }
      36%  { opacity: 0.95; transform: translate(-50%, -50%) scale(1.02); }
      60%, 100% { opacity: 0.6;  transform: translate(-50%, -50%) scale(0.92); }
    }

    main {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      justify-content: center;
    }

    .logo {
      width: 200px;
      height: auto;
      filter: drop-shadow(0 16px 48px rgba(239, 28, 36, 0.3));
    }

    .tagline {
      margin: 28px 0 32px;
      color: var(--muted);
      font-size: 17px;
    }

    .buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    .btn svg { width: 20px; height: 20px; flex: none; }
    .btn-primary { background: var(--red); color: #fff; }
    .btn-primary:hover { background: var(--red-hover); transform: translateY(-1px); }
    .btn-ghost { background: var(--surface); color: var(--text); border-color: var(--border); }
    .btn-ghost:hover { border-color: #4a4a55; transform: translateY(-1px); }
    .btn:focus-visible { outline: 3px solid var(--red-hover); outline-offset: 3px; }

    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
      body::before { animation: none; opacity: 0.8; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo-640.png" alt="ZareStreams" width="517" height="640" />
    <p class="tagline">Live TV, movies and TV shows.</p>

    <div class="buttons">
      <a class="btn btn-primary" href="https://android.zarestreams.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg>
        Android App
      </a>
      <a class="btn btn-ghost" href="https://time2watch.dev">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8"/></svg>
        Web App
      </a>
      <a class="btn btn-ghost" href="mailto:support@zarestreams.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        Contact Us
      </a>
    </div>
  </main>

  <footer>&copy; <span id="year">2026</span> ZareStreams</footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
